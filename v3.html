<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linear vs Exponential Growth</title>
<style>
  :root {
    --bg: #ffffff;
    --ink: #1f2933;
    --muted: #5b6672;
    --line: #d9dee4;
    --lin: #2f6db5;
    --exp: #d1641c;
    --panel: #f5f7fa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0 16px 40px;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 20px;
    line-height: 1.45;
  }
  main { max-width: 1200px; margin: 0 auto; }
  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  h1 { font-size: 2.1rem; margin: 24px 0 4px; }
  .sub { color: var(--muted); margin: 0 0 18px; }
  .layout { display: grid; grid-template-columns: 340px 1fr; gap: 24px; align-items: start; }
  .controls { background: var(--panel); border-radius: 12px; padding: 18px; }
  .control { margin-bottom: 18px; }
  .control label { display: flex; justify-content: space-between; font-weight: 600; font-size: 1rem; }
  .control output { font-variant-numeric: tabular-nums; color: var(--ink); }
  input[type=range] { width: 100%; height: 32px; accent-color: #3e4a57; }
  .control.lin label { color: var(--lin); }
  .control.exp label { color: var(--exp); }
  .results { display: grid; gap: 10px; margin-top: 6px; }
  .result { background: #fff; border-radius: 8px; padding: 10px 12px; border-left: 6px solid var(--c); }
  .result .k { font-size: 0.9rem; color: var(--muted); }
  .result .v { font-size: 1.5rem; font-weight: 700; color: var(--c); font-variant-numeric: tabular-nums; }
  .chart-box { position: relative; }
  canvas { width: 100%; height: 520px; display: block; }
  .legend { display: flex; gap: 24px; flex-wrap: wrap; margin: 6px 0 0 8px; font-weight: 600; }
  .legend span::before {
    content: ""; display: inline-block; width: 28px; height: 5px; border-radius: 3px;
    background: var(--c); vertical-align: middle; margin-right: 8px;
  }
  .notes { margin-top: 12px; display: grid; gap: 6px; font-size: 1.05rem; }
  .lang-btn {
    margin-top: 28px; font: inherit; font-size: 1rem; font-weight: 600;
    padding: 8px 18px; border-radius: 8px; border: 2px solid #3e4a57;
    background: #fff; color: #3e4a57; cursor: pointer; white-space: nowrap;
  }
  .lang-btn:focus-visible { outline: 3px solid #f0b429; outline-offset: 2px; }
  @media (max-width: 860px) {
    body { font-size: 17px; }
    h1 { font-size: 1.6rem; }
    .layout { grid-template-columns: 1fr; }
    canvas { height: 360px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1 data-t="title"></h1>
      <p class="sub" data-t="subtitle"></p>
    </div>
    <button class="lang-btn" id="langBtn"></button>
  </header>

  <div class="layout">
    <div class="controls">
      <div class="control">
        <label><span data-t="start"></span><output id="startOut"></output></label>
        <input type="range" id="start" min="10" max="1000" step="10" value="100">
      </div>
      <div class="control lin">
        <label><span data-t="add"></span><output id="addOut"></output></label>
        <input type="range" id="add" min="0" max="200" step="1" value="10">
      </div>
      <div class="control exp">
        <label><span data-t="rate"></span><output id="rateOut"></output></label>
        <input type="range" id="rate" min="0" max="30" step="0.5" value="5">
      </div>
      <div class="control">
        <label><span data-t="years"></span><output id="yearsOut"></output></label>
        <input type="range" id="years" min="5" max="100" step="1" value="50">
      </div>
      <div class="results">
        <div class="result" style="--c: var(--lin)"><div class="k" id="linK"></div><div class="v" id="linV"></div></div>
        <div class="result" style="--c: var(--exp)"><div class="k" id="expK"></div><div class="v" id="expV"></div></div>
      </div>
    </div>

    <div class="chart-box">
      <canvas id="chart"></canvas>
      <div class="legend">
        <span style="--c: var(--lin)" data-t="linName"></span>
        <span style="--c: var(--exp)" data-t="expName"></span>
      </div>
      <div class="notes">
        <div id="crossNote"></div>
        <div id="doubleNote"></div>
      </div>
    </div>
  </div>
</main>

<script>
/* ---------- Text (all words shown on the page) ---------- */
const TEXT = {
  en: {
    title: "Linear vs Exponential Growth",
    subtitle: "Move the sliders to compare growth by a fixed amount with growth by a fixed percentage.",
    start: "Starting value",
    add: "Amount added per year (linear)",
    rate: "Growth rate per year (exponential)",
    years: "Number of years",
    linName: "Linear growth",
    expName: "Exponential growth",
    xAxis: "Year",
    yAxis: "Value",
    after: n => "Value after " + n + " years",
    cross: y => "The exponential line overtakes the linear line in year " + y + ".",
    crossLabel: y => "Crossover: year " + y,
    noCross: n => "The lines do not cross within " + n + " years. Try more years or a higher growth rate.",
    ahead: "The exponential line is ahead from the start.",
    doubling: t => "Doubling time: about " + t + " years. Each dot marks another doubling.",
    noDoubling: "With 0% growth, the exponential line never doubles.",
    switchTo: "中文",
    locale: "en"
  },
  zh: {
    title: "线性增长与指数增长",
    subtitle: "拖动滑块，比较按固定数量增长与按固定百分比增长。",
    start: "初始值",
    add: "每年增加量（线性）",
    rate: "每年增长率（指数）",
    years: "年数",
    linName: "线性增长",
    expName: "指数增长",
    xAxis: "年",
    yAxis: "数值",
    after: n => n + " 年后的数值",
    cross: y => "指数增长在第 " + y + " 年超过线性增长。",
    crossLabel: y => "交叉点：第 " + y + " 年",
    noCross: n => "在 " + n + " 年内两条线没有交叉。请尝试增加年数或提高增长率。",
    ahead: "指数增长从一开始就领先。",
    doubling: t => "翻倍时间：约 " + t + " 年。每个圆点表示又翻了一倍。",
    noDoubling: "增长率为 0% 时，指数增长永远不会翻倍。",
    switchTo: "English",
    locale: "zh-CN"
  }
};
let lang = "en";
const T = () => TEXT[lang];

/* ---------- Elements ---------- */
const $ = id => document.getElementById(id);
const sliders = { start: $("start"), add: $("add"), rate: $("rate"), years: $("years") };
const canvas = $("chart");
const ctx = canvas.getContext("2d");

const fmt = v => new Intl.NumberFormat(T().locale, { maximumFractionDigits: v < 100 ? 1 : 0 }).format(v);
const fmtShort = v => new Intl.NumberFormat(T().locale, { notation: "compact", maximumFractionDigits: 1 }).format(v);

function params() {
  return {
    S: +sliders.start.value,
    A: +sliders.add.value,
    r: +sliders.rate.value / 100,
    N: +sliders.years.value
  };
}
const linAt = (p, t) => p.S + p.A * t;
const expAt = (p, t) => p.S * Math.pow(1 + p.r, t);

/* First year in which the exponential line rises above the linear line. */
function crossover(p) {
  if (p.S * Math.log(1 + p.r) >= p.A && p.r > 0) return { ahead: true };
  const step = 0.01;
  let prev = expAt(p, 0) - linAt(p, 0);
  for (let t = step; t <= p.N + 1e-9; t += step) {
    const d = expAt(p, t) - linAt(p, t);
    if (prev <= 0 && d > 0) return { t };
    prev = d;
  }
  return { none: true };
}

function niceStep(range, target) {
  const raw = range / target;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const n = raw / mag;
  return (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * mag;
}

function draw() {
  const p = params();
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  const small = W < 500;
  const pad = { l: small ? 58 : 84, r: small ? 16 : 28, t: 20, b: small ? 52 : 64 };
  const pw = W - pad.l - pad.r, ph = H - pad.t - pad.b;
  const yMax = Math.max(linAt(p, p.N), expAt(p, p.N)) * 1.08;
  const X = t => pad.l + (t / p.N) * pw;
  const Y = v => pad.t + ph - (v / yMax) * ph;
  const fontPx = small ? 13 : 16;

  // grid and axes
  ctx.font = fontPx + "px -apple-system, Segoe UI, Arial, sans-serif";
  ctx.fillStyle = "#5b6672";
  ctx.strokeStyle = "#e4e8ec";
  ctx.lineWidth = 1;
  const yStep = niceStep(yMax, 5);
  ctx.textAlign = "right"; ctx.textBaseline = "middle";
  for (let v = 0; v <= yMax; v += yStep) {
    ctx.beginPath(); ctx.moveTo(pad.l, Y(v)); ctx.lineTo(pad.l + pw, Y(v)); ctx.stroke();
    ctx.fillText(fmtShort(v), pad.l - 10, Y(v));
  }
  const xStep = niceStep(p.N, small ? 5 : 10);
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  for (let t = 0; t <= p.N + 1e-9; t += xStep) {
    ctx.beginPath(); ctx.moveTo(X(t), pad.t); ctx.lineTo(X(t), pad.t + ph); ctx.stroke();
    ctx.fillText(Math.round(t), X(t), pad.t + ph + 8);
  }
  ctx.strokeStyle = "#3e4a57"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(pad.l, pad.t); ctx.lineTo(pad.l, pad.t + ph); ctx.lineTo(pad.l + pw, pad.t + ph); ctx.stroke();

  ctx.fillStyle = "#1f2933"; ctx.font = "600 " + fontPx + "px -apple-system, Segoe UI, Arial, sans-serif";
  ctx.fillText(T().xAxis, pad.l + pw / 2, pad.t + ph + (small ? 28 : 34));
  ctx.save();
  ctx.translate(14, pad.t + ph / 2); ctx.rotate(-Math.PI / 2);
  ctx.textBaseline = "middle"; ctx.fillText(T().yAxis, 0, 0);
  ctx.restore();

  // lines
  const css = getComputedStyle(document.documentElement);
  const linC = css.getPropertyValue("--lin").trim(), expC = css.getPropertyValue("--exp").trim();
  const plot = (f, colour) => {
    ctx.strokeStyle = colour; ctx.lineWidth = small ? 3 : 4; ctx.lineJoin = "round";
    ctx.beginPath();
    const steps = 400;
    for (let i = 0; i <= steps; i++) {
      const t = (i / steps) * p.N;
      i ? ctx.lineTo(X(t), Y(f(p, t))) : ctx.moveTo(X(t), Y(f(p, t)));
    }
    ctx.stroke();
  };
  plot(linAt, linC);
  plot(expAt, expC);

  // doubling dots on the exponential line
  const c = crossover(p);
  const crossX = c.t !== undefined ? X(c.t) : -1e9;
  if (p.r > 0) {
    const D = Math.log(2) / Math.log(1 + p.r);
    let lastX = -Infinity;
    for (let k = 1; k * D <= p.N; k++) {
      const t = k * D, x = X(t), y = Y(expAt(p, t));
      ctx.fillStyle = "#fff"; ctx.strokeStyle = expC; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(x, y, small ? 4 : 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      if (x - lastX > 44 && y > pad.t + 14 && Math.abs(x - crossX) > 80) {
        ctx.fillStyle = expC; ctx.font = "600 " + (fontPx - 2) + "px -apple-system, Segoe UI, Arial, sans-serif";
        ctx.textAlign = "right"; ctx.textBaseline = "bottom";
        ctx.fillText("×" + Math.pow(2, k), x - 6, y - 6);
        lastX = x;
      }
    }
  }
  // crossover point
  if (c.t !== undefined) {
    const x = X(c.t), y = Y(linAt(p, c.t));
    ctx.setLineDash([6, 6]); ctx.strokeStyle = "#1f2933"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, pad.t + ph); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = "#1f2933";
    ctx.beginPath(); ctx.arc(x, y, small ? 6 : 8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(x, y, small ? 2.5 : 3.5, 0, Math.PI * 2); ctx.fill();
    const label = T().crossLabel(Math.round(c.t));
    ctx.font = "700 " + fontPx + "px -apple-system, Segoe UI, Arial, sans-serif";
    const w = ctx.measureText(label).width + 16;
    let lx = x + 12, ly = y - 44;
    if (lx + w > pad.l + pw) lx = x - 12 - w;
    if (ly < pad.t) ly = y + 14;
    ctx.fillStyle = "rgba(255,255,255,0.92)"; ctx.strokeStyle = "#1f2933"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(lx, ly, w, 30, 6) : ctx.rect(lx, ly, w, 30); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#1f2933"; ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillText(label, lx + 8, ly + 15);
  }

  // readouts
  $("startOut").textContent = fmt(p.S);
  $("addOut").textContent = "+" + fmt(p.A);
  $("rateOut").textContent = sliders.rate.value + "%";
  $("yearsOut").textContent = p.N;
  $("linK").textContent = T().linName + " · " + T().after(p.N);
  $("expK").textContent = T().expName + " · " + T().after(p.N);
  $("linV").textContent = fmt(linAt(p, p.N));
  $("expV").textContent = fmt(expAt(p, p.N));

  $("crossNote").textContent =
    c.ahead ? T().ahead : c.none ? T().noCross(p.N) : T().cross(Math.round(c.t));
  $("doubleNote").textContent =
    p.r > 0 ? T().doubling(fmt(Math.log(2) / Math.log(1 + p.r))) : T().noDoubling;
}

function applyText() {
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = T()[el.dataset.t]; });
  document.title = T().title;
  document.documentElement.lang = T().locale;
  $("langBtn").textContent = T().switchTo;
  draw();
}

Object.values(sliders).forEach(s => s.addEventListener("input", draw));
window.addEventListener("resize", draw);
$("langBtn").addEventListener("click", () => { lang = lang === "en" ? "zh" : "en"; applyText(); });
applyText();
</script>
</body>
</html>
